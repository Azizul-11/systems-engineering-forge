    // MINi Project: Double the Prices

    function doublePrices(priceNodeList) {
    // 1. Use the Spread Operator [...] to explode the NodeList into a REAL Array
    const realArray = [...priceNodeList];

    // 2. Now we can use .map()!
    const doubledValues = realArray.map(node => {
        // Coerce the text into a number, then multiply
        const rawNumber = Number(node.textContent);
        return rawNumber * 2;
    });

    return doubledValues;
}

const nodes = document.querySelectorAll(".price");
